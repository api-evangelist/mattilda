name: Mattilda
description: >-
  Mattilda is a financial management platform for private educational
  institutions across Latin America, operating in Mexico, Colombia, and Ecuador.
  It automates tuition collection and payment processing, offers tuition advances
  that guarantee schools receive full monthly tuition on the first day regardless
  of family payment rates, and provides academic operations and admissions tools
  under its Algebraix product line. Families can pay through multiple channels,
  including WhatsApp. Mattilda operates under the oversight of Mexico's financial
  authorities CNBV and CONDUSEF and is backed by QED Investors. Mattilda does not
  currently expose a public developer API, SDKs, or documentation portal; this
  profile captures the company's public identity, status page, and Vanta-hosted
  trust center.
